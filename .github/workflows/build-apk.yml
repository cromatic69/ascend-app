name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Android tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install app tools
        run: npm install

      - name: Add Android if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Add the Ascend icon and splash screen
        continue-on-error: true
        run: |
          python -m pip install pillow
          python tools/apply_branding.py

      - name: Copy the app into Android
        run: npx cap sync android

      - name: Build the APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: ascend-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
